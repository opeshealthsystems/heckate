<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Network Convergence</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#071D38;--blue:#1764B3;--flow:#67B8F3;--steel:#9AA7B5;--white:#fff}
body{margin:0;min-height:100vh;background:#030c19;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:Montserrat,system-ui,sans-serif;color:#cfe0f5;padding:16px;box-sizing:border-box}
.phone{width:min(360px,100%);aspect-ratio:360/800;border-radius:28px;overflow:hidden;box-shadow:0 0 0 8px #10161f,0 20px 60px #000}
svg{display:block;width:100%;height:100%}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:13px}
button{font:inherit;background:#0d2a4f;color:#fff;border:1px solid #1764B3;border-radius:8px;padding:7px 12px;cursor:pointer}
button.on{background:#1764B3}
#clock{font-variant-numeric:tabular-nums;min-width:120px;text-align:center;align-self:center}
.ic{fill:none;stroke:var(--steel);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ln{fill:none;stroke:#3a5f8a;stroke-width:1.5;stroke-linecap:round}
.cv{fill:none;stroke:var(--flow);stroke-width:1.25;stroke-linecap:round}
</style></head><body>
<div class="phone"><svg viewBox="0 0 360 800" id="s">
<defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#0f2a4d" stroke-width=".6"/></pattern></defs>
<rect width="360" height="800" fill="#071D38"/><rect width="360" height="800" fill="url(#g)" opacity=".55"/>

<!-- 01 network ignition: pathways from opposite edges -->
<path id="pL" class="ln" pathLength="1" data-a="0,.35" d="M0,470 H40"/>
<path id="pR" class="ln" pathLength="1" data-a="0,.35" d="M360,470 H320"/>
<circle class="dot" cx="40" cy="470" r="2.5" fill="#67B8F3" data-f=".2,.35"/>
<circle class="dot" cx="320" cy="470" r="2.5" fill="#67B8F3" data-f=".2,.35"/>

<!-- 02 router / switch + server rack -->
<g class="ic" transform="translate(64,470)">
 <rect x="-24" y="-12" width="48" height="24" rx="4" pathLength="1" data-a=".35,.7"/>
 <path d="M-15,0 h0 M-7,0 h0 M1,0 h0" stroke-width="3.5" stroke="#67B8F3" data-f=".6,.75"/>
 <path d="M10,-5 v10 M16,-5 v10" pathLength="1" data-a=".55,.75"/>
</g>
<g class="ic" transform="translate(296,470)">
 <rect x="-20" y="-30" width="40" height="60" rx="3" pathLength="1" data-a=".4,.75"/>
 <path d="M-20,-10 H20 M-20,10 H20" pathLength="1" data-a=".55,.8"/>
 <path d="M-12,-20 h8 M-12,0 h8 M-12,20 h8" pathLength="1" data-a=".65,.85"/>
 <circle cx="12" cy="-20" r="1.6" fill="#67B8F3" stroke="none" data-f=".7,.85"/><circle cx="12" cy="0" r="1.6" fill="#67B8F3" stroke="none" data-f=".75,.85"/><circle cx="12" cy="20" r="1.6" fill="#67B8F3" stroke="none" data-f=".8,.85"/>
</g>
<path id="rs" class="ln" pathLength="1" data-a=".55,.85" d="M88,470 H276"/>
<!-- gateway on the link -->
<g class="ic" transform="translate(180,470)"><path d="M-9,-11 L0,-15 L9,-11 V-2 C9,6 4,11 0,13 C-4,11 -9,6 -9,-2 Z" pathLength="1" data-a=".85,1.1" fill="#071D38"/></g>

<!-- 03 internet + cloud -->
<g class="ic" transform="translate(64,150)">
 <circle r="22" pathLength="1" data-a=".85,1.15"/>
 <path d="M-22,0 H22 M0,-22 C-11,-10 -11,10 0,22 M0,-22 C11,-10 11,10 0,22 M-18,-12 H18 M-18,12 H18" pathLength="1" data-a="1,1.3"/>
</g>
<g class="ic" transform="translate(296,150)">
 <path d="M-22,10 H20 A11,11 0 0 0 18,-11 A15,15 0 0 0 -10,-12 A12,12 0 0 0 -22,10 Z" pathLength="1" data-a="1.05,1.4"/>
</g>
<path id="gr" class="ln" pathLength="1" data-a=".95,1.25" d="M64,174 V458"/>
<path id="sc" class="ln" pathLength="1" data-a="1.1,1.4" d="M296,440 V164"/>

<!-- 04 backup storage -->
<g class="ic" transform="translate(180,610)">
 <ellipse cx="0" cy="-14" rx="20" ry="6" pathLength="1" data-a="1.4,1.65"/>
 <path d="M-20,-14 V14 C-20,22 20,22 20,14 V-14 M-20,0 C-20,8 20,8 20,0" pathLength="1" data-a="1.45,1.7"/>
</g>
<path id="sb" class="ln" pathLength="1" data-a="1.4,1.6" d="M296,500 V610 H202"/>

<!-- 05 convergence traces -->
<path class="cv" pathLength="1" data-a="1.95,2.3" data-o="1.95,2.7" d="M86,150 C130,150 150,240 168,290"/>
<path class="cv" pathLength="1" data-a="1.95,2.3" data-o="1.95,2.7" d="M274,150 C230,150 210,240 192,290"/>
<path class="cv" pathLength="1" data-a="2,2.35" data-o="2,2.7" d="M90,470 C130,470 150,400 168,350"/>
<path class="cv" pathLength="1" data-a="2,2.35" data-o="2,2.7" d="M272,470 C230,470 210,400 192,350"/>
<path class="cv" pathLength="1" data-a="2.05,2.35" data-o="2.05,2.7" d="M180,590 V490"/>

<!-- HEKATE symbol (owner-supplied shield, redrawn) -->
<g id="emb" transform="translate(180,310) scale(.165) translate(-627,-628)">
 <path d="M627,148 C800,160 950,205 1055,272 L1056,560 C1056,800 900,980 627,1110 C354,980 198,800 198,560 L199,272 C304,205 454,160 627,148 Z" fill="#071D38" stroke="#fff" stroke-width="40" stroke-linejoin="round" pathLength="1" data-a="2.0,2.4"/>
 <path data-f="2.2,2.4" d="M262,368 C420,260 540,245 627,245 C714,245 834,260 992,370 C834,305 714,288 627,288 C540,288 420,305 262,368 Z" fill="#00B8FF"/>
 <path data-f="2.15,2.35" d="M363,378 H484 a6,6 0 0 1 6,6 V510 H765 V384 a6,6 0 0 1 6,-6 H891 a6,6 0 0 1 6,6 V756 a6,6 0 0 1 -6,6 H771 a6,6 0 0 1 -6,-6 V597 H490 V756 a6,6 0 0 1 -6,6 H363 a6,6 0 0 1 -6,-6 V384 a6,6 0 0 1 6,-6 Z" fill="#fff"/>
 <polygon data-f="2.25,2.4" points="525,766 627,621 730,766" fill="#00B8FF"/>
 <g stroke="#fff" stroke-width="11" fill="none"><path pathLength="1" data-a="2.2,2.4" d="M627,1085 V838"/><path pathLength="1" data-a="2.2,2.4" d="M572,1058 V925 L507,862"/><path pathLength="1" data-a="2.2,2.4" d="M685,1058 V925 L750,862"/>
 <circle pathLength="1" data-a="2.3,2.4" cx="627" cy="818" r="16"/><circle pathLength="1" data-a="2.3,2.4" cx="494" cy="850" r="16"/><circle pathLength="1" data-a="2.3,2.4" cx="760" cy="850" r="16"/></g>
</g>

<!-- 06 brand resolution -->
<text data-f="2.4,2.65" x="180" y="712" text-anchor="middle" fill="#fff" font-size="22" font-weight="700" letter-spacing="1">HEKATE SYSTEMS SARL</text>
<text data-f="2.5,2.8" x="180" y="738" text-anchor="middle" fill="#9AA7B5" font-size="11.5" font-weight="500" letter-spacing=".4">Engineering Trust. Securing Tomorrow.</text>
<g id="pk"></g>
</svg></div>
<div class="ctl"><button id="rp">Replay</button><button id="sl">Slow ×0.25</button><button id="lp" class="on">Loop</button><span id="clock"></span></div>
<script>
const s=document.getElementById('s'),NS='http://www.w3.org/2000/svg';
const ease=x=>x<0?0:x>1?1:x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const rng=(a,t)=>{const[s0,e]=a.split(',').map(Number);return ease((t-s0)/(e-s0))};
const A=[...s.querySelectorAll('[data-a]')],F=[...s.querySelectorAll('[data-f]')],O=[...s.querySelectorAll('[data-o]')];
A.forEach(e=>e.style.strokeDasharray='1 1');
// packets: [path id, start, duration, reverse]
const P=[['rs',.7,.55],['rs',.95,.55],['gr',1.2,.45],['rs',1.45,.45],['sc',1.3,.5],['sc',1.55,.45],['sb',1.6,.35],['sb',1.75,.3,1],['sb',1.85,.35]];
const pk=document.getElementById('pk');
const dots=P.map(()=>{const c=document.createElementNS(NS,'circle');c.setAttribute('r',3);c.setAttribute('fill','#67B8F3');pk.appendChild(c);return c});
const paths=P.map(p=>document.getElementById(p[0]));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const END=2.8,HOLD=1.6;let t0=performance.now(),speed=1,loop=true,acc=0,last=t0;
function frame(t){
  A.forEach(e=>e.style.strokeDashoffset=1-rng(e.dataset.a,t));
  F.forEach(e=>e.style.opacity=rng(e.dataset.f,t));
  O.forEach(e=>{const[a,b]=e.dataset.o.split(',').map(Number);e.style.opacity=t<b-.3?1:1-ease((t-(b-.3))/.3)});
  P.forEach((p,i)=>{let u=(t-p[1])/p[2];const d=dots[i];if(u<0||u>1){d.style.opacity=0;return}
    u=ease(u);if(p[3])u=1-u;const L=paths[i].getTotalLength(),q=paths[i].getPointAtLength(u*L);
    d.setAttribute('cx',q.x);d.setAttribute('cy',q.y);d.style.opacity=Math.min(1,Math.sin(Math.PI*((t-p[1])/p[2]))*2)});
  document.getElementById('clock').textContent=Math.min(t,END).toFixed(2)+' s / '+END+' s';
}
function tick(now){acc+=(now-last)/1000*speed;last=now;
  if(acc>END+HOLD&&loop)acc=0;frame(reduce?END:Math.min(acc,END));requestAnimationFrame(tick)}
requestAnimationFrame(tick);
document.getElementById('rp').onclick=()=>acc=0;
document.getElementById('sl').onclick=e=>{speed=speed===1?.25:1;e.target.classList.toggle('on',speed!==1)};
document.getElementById('lp').onclick=e=>{loop=!loop;e.target.classList.toggle('on',loop)};
</script></body></html>
