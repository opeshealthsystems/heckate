<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign-in Preview</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#071D38;--blue:#1764B3;--flow:#67B8F3;--steel:#9AA7B5;--white:#fff}
body{margin:0;min-height:100vh;background:#030c19;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:Montserrat,system-ui,sans-serif;color:#cfe0f5;padding:16px;box-sizing:border-box}
.phone{width:min(360px,100%);aspect-ratio:360/800;border-radius:28px;overflow:hidden;box-shadow:0 0 0 8px #10161f,0 20px 60px #000}
svg{display:block;width:100%;height:100%}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:13px}
button{font:inherit;background:#0d2a4f;color:#fff;border:1px solid #1764B3;border-radius:8px;padding:7px 12px;cursor:pointer}
button.on{background:#1764B3}
#clock{font-variant-numeric:tabular-nums;min-width:120px;text-align:center;align-self:center}
.ic{fill:none;stroke:var(--steel);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ln{fill:none;stroke:#3a5f8a;stroke-width:1.5;stroke-linecap:round}
.cv{fill:none;stroke:var(--flow);stroke-width:1.25;stroke-linecap:round}

.phone{position:relative;background:#071D38}
.bgw{position:absolute;inset:0;opacity:.6}
.wrap{position:absolute;inset:0;display:flex;align-items:center;padding:0 20px;font-family:system-ui,-apple-system,Roboto,sans-serif}
.card{width:100%;background:rgba(9,27,52,.88);border:1px solid #1F4677;border-radius:18px;padding:20px;box-sizing:border-box;backdrop-filter:blur(2px)}
.hd{text-align:center}.hd svg{width:56px;height:56px;margin:0 auto}
h1{color:#EAF2FF;font-size:19px;font-weight:600;margin:10px 0 2px}.sub{color:#7FA6D6;font-size:13px;margin-bottom:14px}
label{display:block;color:#8FB3DD;font-size:12px;margin:10px 0 5px}
input{width:100%;box-sizing:border-box;height:46px;border:1px solid #2C5A92;border-radius:10px;background:#071B36;color:#EAF2FF;font-size:16px;padding:0 12px;outline:none}
input:focus{border-color:#3B9BFF}input::placeholder{color:#4C6E99}
.pri{width:100%;margin-top:18px;height:48px;border-radius:10px;background:#2F7BEA;border:0;color:#fff;font-size:16px;font-weight:600}
.sec{width:100%;margin-top:10px;height:46px;border-radius:10px;border:1px solid #2C5A92;background:none;color:#CFE3FF;font-size:15px}
.ft{color:#4F8F6F;font-size:11px;text-align:center;margin-top:16px;font-family:monospace}
.err{color:#F08A8C;font-size:13px;margin-top:10px;display:none}
</style></head><body>
