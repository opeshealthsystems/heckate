<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure Perimeter</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;background:#030c19;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:Montserrat,system-ui,sans-serif;color:#cfe0f5;padding:16px;box-sizing:border-box}
.phone{width:min(360px,100%);aspect-ratio:360/800;border-radius:28px;overflow:hidden;box-shadow:0 0 0 8px #10161f,0 20px 60px #000}
svg{display:block;width:100%;height:100%}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:13px}
button{font:inherit;background:#0d2a4f;color:#fff;border:1px solid #1764B3;border-radius:8px;padding:7px 12px;cursor:pointer}
button.on{background:#1764B3}#clock{min-width:120px;text-align:center;align-self:center;font-variant-numeric:tabular-nums}
</style></head><body>
<div class="phone"><svg viewBox="0 0 360 800" id="s"></svg></div>
<div class="ctl"><button id="rp">Replay</button><button id="sl">Slow ×0.25</button><button id="lp" class="on">Loop</button><span id="clock"></span></div>
<script>
// HS-MOTION-002 "Secure Perimeter": six facilities form a protected ring, a scan verifies it, the ring locks onto the HEKATE shield.
const NS='http://www.w3.org/2000/svg',S=document.getElementById('s');
const STEEL='#9AA7B5',FLOW='#67B8F3',LINK='#3A5F8A',BG='#071D38';
const ease=x=>x<=0?0:x>=1?1:x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2,p=(t,a,b)=>ease((t-a)/(b-a));
const CX=180,CY=300,R=118;
const GLYPH={
 globe:'M-9,0H9M0,-9C-5,-4-5,4 0,9M0,-9C5,-4 5,4 0,9M-8,-4H8M-8,4H8',
 cloud:'M-9,4H8A4.5,4.5 0 0 0 7,-4.5A6,6 0 0 0-4,-5A5,5 0 0 0-9,4Z',
 server:'M-7,-9H7V9H-7ZM-7,-3H7M-7,3H7M-4,-6h3M-4,0h3M-4,6h3',
 db:'M-7,-6A7,2.5 0 0 0 7,-6A7,2.5 0 0 0-7,-6V6A7,2.5 0 0 0 7,6V-6M-7,0A7,2.5 0 0 0 7,0',
 router:'M-9,-4H9V5H-9ZM-5,0.5h0M-1,0.5h0M3,0.5h0M4,-4V-8M-4,-4V-8',
 site:'M-8,9V-3L0,-9L8,-3V9ZM-3,9V3H3V9',
};
// facilities clockwise from top
const NODES=['globe','cloud','server','db','router','site'].map((g,i)=>{const a=-Math.PI/2+i*Math.PI/3;return{g,x:CX+R*Math.cos(a),y:CY+R*Math.sin(a),a}});
const C=2*Math.PI*R;
S.innerHTML=`<defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#0f2a4d" stroke-width=".6"/></pattern>
<linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="${FLOW}" stop-opacity="0"/><stop offset="1" stop-color="${FLOW}" stop-opacity=".35"/></linearGradient></defs>
<rect width="360" height="800" fill="${BG}"/><rect width="360" height="800" fill="url(#g)" opacity=".55"/>
<circle id="r2" cx="${CX}" cy="${CY}" r="${R+34}" fill="none" stroke="#173a63" stroke-width="1" stroke-dasharray="2 6"/>
<circle id="ring" cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${LINK}" stroke-width="1.5" transform="rotate(-90 ${CX} ${CY})"/>
<circle id="lock" cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${FLOW}" stroke-width="2" transform="rotate(-90 ${CX} ${CY})"/>
<path id="sweep" fill="url(#sw)"/>
<g id="spokes">${NODES.map(n=>`<line x1="${n.x}" y1="${n.y}" x2="${CX+(n.x-CX)*.42}" y2="${CY+(n.y-CY)*.42}" stroke="${FLOW}" stroke-width="1.25" stroke-linecap="round"/>`).join('')}</g>
<g id="nodes">${NODES.map(n=>`<g transform="translate(${n.x},${n.y})"><circle r="17" fill="${BG}" stroke="${STEEL}" stroke-width="1.5"/><path d="${GLYPH[n.g]}" fill="none" stroke="${STEEL}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle class="led" cx="12" cy="-12" r="2.4" fill="${FLOW}"/></g>`).join('')}</g>
<g id="pk"></g>
<g id="emb" transform="translate(${CX},${CY})"><g id="embS"><g transform="translate(-627,-628)">
 <path d="M627,148 C800,160 950,205 1055,272 L1056,560 C1056,800 900,980 627,1110 C354,980 198,800 198,560 L199,272 C304,205 454,160 627,148 Z" fill="${BG}" stroke="#fff" stroke-width="40" stroke-linejoin="round"/>
 <path d="M262,368 C420,260 540,245 627,245 C714,245 834,260 992,370 C834,305 714,288 627,288 C540,288 420,305 262,368 Z" fill="#00B8FF"/>
 <path d="M363,378 H484 a6,6 0 0 1 6,6 V510 H765 V384 a6,6 0 0 1 6,-6 H891 a6,6 0 0 1 6,6 V756 a6,6 0 0 1 -6,6 H771 a6,6 0 0 1 -6,-6 V597 H490 V756 a6,6 0 0 1 -6,6 H363 a6,6 0 0 1 -6,-6 V384 a6,6 0 0 1 6,-6 Z" fill="#fff"/>
 <polygon points="525,766 627,621 730,766" fill="#00B8FF"/>
 <g stroke="#fff" stroke-width="11" fill="none"><path d="M627,1085 V838"/><path d="M572,1058 V925 L507,862"/><path d="M685,1058 V925 L750,862"/><circle cx="627" cy="818" r="16"/><circle cx="494" cy="850" r="16"/><circle cx="760" cy="850" r="16"/></g>
</g></g></g>
<text id="t1" x="180" y="560" text-anchor="middle" fill="#fff" font-size="22" font-weight="700" letter-spacing="1">HEKATE SYSTEMS SARL</text>
<text id="t2" x="180" y="586" text-anchor="middle" fill="${STEEL}" font-size="11.5" font-weight="500">Engineering Trust. Securing Tomorrow.</text>`;
const $=id=>document.getElementById(id),nodeEls=[...$('nodes').children],spokes=[...$('spokes').children];
// packets travel clockwise along the ring between neighbouring facilities: [from node, start, dur]
const PK=[[0,.9,.35],[1,1.0,.35],[2,1.1,.35],[3,1.2,.35],[4,1.3,.35],[5,1.4,.35],[0,1.35,.35],[3,1.5,.35]];
const dots=PK.map(()=>{const c=document.createElementNS(NS,'circle');c.setAttribute('r',3);c.setAttribute('fill',FLOW);$('pk').appendChild(c);return c});
function frame(t){
 const ring=p(t,0,.45);$('ring').setAttribute('stroke-dasharray',`${C*ring} ${C}`);
 $('r2').style.opacity=p(t,.2,.6)*.8;
 nodeEls.forEach((g,i)=>{const s=.3+i*.1,u=p(t,s,s+.25);g.style.opacity=u;g.setAttribute('transform',`translate(${NODES[i].x},${NODES[i].y}) scale(${.7+.3*u})`);
  g.querySelector('.led').style.opacity=t>s+.3?1:0});
 PK.forEach(([n,s,d],i)=>{const u=(t-s)/d,c=dots[i];if(u<0||u>1){c.style.opacity=0;return}
  const a=NODES[n].a+ease(u)*Math.PI/3;c.setAttribute('cx',CX+R*Math.cos(a));c.setAttribute('cy',CY+R*Math.sin(a));c.style.opacity=Math.min(1,Math.sin(Math.PI*u)*2)});
 // scan: one full sweep 1.3–1.95 s
 const su=(t-1.3)/.65;if(su>0&&su<1){const a1=-Math.PI/2+ease(su)*2*Math.PI,a0=a1-.6;
  $('sweep').setAttribute('d',`M${CX},${CY}L${CX+R*Math.cos(a0)},${CY+R*Math.sin(a0)}A${R},${R} 0 0 1 ${CX+R*Math.cos(a1)},${CY+R*Math.sin(a1)}Z`);$('sweep').style.opacity=1}else $('sweep').style.opacity=0;
 const lk=p(t,1.3,1.95);$('lock').setAttribute('stroke-dasharray',`${C*lk} ${C}`);$('lock').style.opacity=t<2.3?1:1-p(t,2.3,2.7)*.6;
 spokes.forEach((l,i)=>{const s=1.9+i*.03,u=p(t,s,s+.3),L=R*.58;l.setAttribute('stroke-dasharray',`${L*u} ${L}`);l.style.opacity=t<2.4?1:1-p(t,2.4,2.75)});
 const e=p(t,1.95,2.4);$('emb').style.opacity=e;$('embS').setAttribute('transform',`scale(${.1+.03*e})`);
 $('t1').style.opacity=p(t,2.4,2.65);$('t2').style.opacity=p(t,2.5,2.8);
 $('clock').textContent=Math.min(t,2.8).toFixed(2)+' s / 2.8 s';
}
let acc=0,last=performance.now(),speed=1,loop=true;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
(function tick(now){acc+=(now-last)/1000*speed;last=now;if(acc>4.4&&loop)acc=0;frame(reduce?2.8:Math.min(acc,2.8));requestAnimationFrame(tick)})(last);
$('rp').onclick=()=>acc=0;$('sl').onclick=e=>{speed=speed===1?.25:1;e.target.classList.toggle('on',speed!==1)};$('lp').onclick=e=>{loop=!loop;e.target.classList.toggle('on',loop)};
</script></body></html>
