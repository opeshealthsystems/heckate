# Local development stack. Production runs on the Proxmox hosts described in the spec.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hekate
      POSTGRES_PASSWORD: dev-only
      POSTGRES_DB: hekate
    ports: ["5432:5432"]
    volumes:
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev-only
    ports: ["8081:8080"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dev
      MINIO_ROOT_PASSWORD: dev-only-secret
    ports: ["9000:9000", "9001:9001"]
  nats:
    image: nats:2.10
    command: ["-js"]
    ports: ["4222:4222"]
