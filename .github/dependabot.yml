version: 2
updates:
  - package-ecosystem: gomod
    directory: /api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /api
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /web
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
