    get:
      operationId: verifyDocumentQr
      summary: "Public check of a signed QR address: the Ed25519 signature against HEKATE's published key, then the register"
      security: []
      responses:
        "200":
          description: "Verification result; signature.valid says whether HEKATE signed the code"
          content:
            application/json:
