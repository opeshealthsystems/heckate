openapi: 3.1.0
info:
  title: HEKATE Platform API
  version: 1.0.0
  description: Single API for the web ERP, portals and mobile app. Contract-first; SDKs are generated from this file.
  license:
    name: Proprietary
    identifier: LicenseRef-HEKATE
servers:
  - url: https://api.hekatesystems.com
security:
  - oauth2: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and database check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/me:
    get:
      operationId: getMe
      summary: The authenticated caller
      responses:
        "200":
          description: Caller identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub: { type: string }
                  email: { type: string }
                  tenant_id: { type: string }
                  roles: { type: array, items: { type: string } }
                  scope: { type: string, enum: [staff, client, other] }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/clients:
    get:
      operationId: listClients
      summary: List client accounts (staff)
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Client" } }
        "4XX": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createClient
      summary: Create a client account (staff)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legal_name]
              properties:
                legal_name: { type: string }
                rccm: { type: string }
                email: { type: string }
                phone: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/clients/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getClient
      summary: Get a client account (staff, or the client's own)
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "4XX": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateClient
      summary: Update contact details or KYC status (KYC: managers only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kyc_status: { type: string, enum: [pending, verified, rejected] }
                email: { type: string }
                phone: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/public/enquiries:
    post:
      operationId: submitEnquiry
      summary: Website contact or quote form; creates a CRM lead
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                company: { type: string }
                message: { type: string }
                website: { type: string, description: Honeypot; must be empty }
      responses:
        "202": { description: Received }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/leads:
    get:
      operationId: listLeads
      summary: List CRM leads (sales)
      responses:
        "200":
          description: Leads
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Lead" } }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/leads/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      operationId: updateLead
      summary: Move a lead through the pipeline or assign an owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stage: { type: string, enum: [new, contacted, qualified, proposal, won, lost] }
                owner: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/tickets:
    get:
      operationId: listTickets
      summary: List tickets (clients see only their own)
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { name: severity, in: query, schema: { $ref: "#/components/schemas/Severity" } }
      responses:
        "200":
          description: A page of tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Ticket" } }
                  next_cursor: { type: [string, "null"] }
        "4XX": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTicket
      summary: Open a ticket or incident
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewTicket" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/tickets/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getTicket
      summary: Get a ticket
      responses:
        "200":
          description: Ticket
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "4XX": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateTicket
      summary: Change status or assignee (clients may only confirm or reopen a resolved ticket)
      parameters:
        - { name: If-Match, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: "#/components/schemas/Status" }
                assignee: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/tickets/{id}/comments:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: listTicketComments
      summary: Conversation on a ticket (internal notes are staff-only)
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Comment" } }
        "4XX": { $ref: "#/components/responses/Problem" }
    post:
      operationId: addTicketComment
      summary: Reply on a ticket
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                internal: { type: boolean, default: false }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/tickets/{id}/rating:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: rateTicket
      summary: Rate a resolved or closed ticket (client)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        "200":
          description: Rated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/reports/support:
    get:
      operationId: getSupportReport
      summary: SLA and satisfaction summary (management)
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  open: { type: integer }
                  sla_breached: { type: integer }
                  p1_open: { type: integer }
                  rated: { type: integer }
                  avg_rating: { type: [number, "null"] }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/documents:
    post:
      operationId: issueDocument
      summary: Issue a document reference and register it
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, title]
              properties:
                code: { type: string, examples: [INV, FRM-23, CRT-A] }
                title: { type: string }
                tenant_id: { type: string, format: uuid }
                sha256: { type: string }
      responses:
        "201":
          description: Issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/documents/{ref}:
    parameters: [{ name: ref, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getDocument
      summary: Register entry for a document
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/documents/{ref}/revoke:
    parameters: [{ name: ref, in: path, required: true, schema: { type: string } }]
    post:
      operationId: revokeDocument
      summary: Revoke a document (managers)
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/public/verify/{ref}:
    parameters: [{ name: ref, in: path, required: true, schema: { type: string } }]
    get:
      operationId: verifyDocument
      summary: Public check of a HEKATE document by reference
      security: []
      responses:
        "200":
          description: Verification result (valid=false for unknown, forged or revoked)
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: { type: boolean }
                  reason: { type: string }
                  ref: { type: string }
                  code: { type: string }
                  title: { type: string }
                  status: { type: string }
                  issued_at: { type: string, format: date-time }
        "4XX": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.hekatesystems.com/realms/hekate/protocol/openid-connect/auth
          tokenUrl: https://auth.hekatesystems.com/realms/hekate/protocol/openid-connect/token
          scopes: {}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Severity: { type: string, enum: [P1, P2, P3, P4] }
    Status: { type: string, enum: [open, in_progress, resolved, closed] }
    Channel: { type: string, enum: [app, portal, email, phone] }
    NewTicket:
      type: object
      required: [subject, severity, channel]
      properties:
        tenant_id: { type: string, format: uuid, description: Required for staff; clients use their own tenant }
        subject: { type: string }
        description: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        channel: { $ref: "#/components/schemas/Channel" }
    Ticket:
      type: object
      required: [id, tenant_id, subject, severity, channel, status, version, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        subject: { type: string }
        description: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        channel: { $ref: "#/components/schemas/Channel" }
        status: { $ref: "#/components/schemas/Status" }
        reporter: { type: string }
        assignee: { type: [string, "null"] }
        respond_due_at: { type: [string, "null"], format: date-time }
        sla_due_at: { type: [string, "null"], format: date-time }
        first_response_at: { type: [string, "null"], format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
        sla_breached: { type: boolean }
        rating: { type: [integer, "null"] }
        rating_comment: { type: [string, "null"] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticket_id: { type: string, format: uuid }
        author: { type: string }
        body: { type: string }
        internal: { type: boolean }
        created_at: { type: string, format: date-time }
    Client:
      type: object
      properties:
        tenant_id: { type: string, format: uuid }
        legal_name: { type: string }
        rccm: { type: [string, "null"] }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        kyc_status: { type: string, enum: [pending, verified, rejected] }
        created_at: { type: string, format: date-time }
    Lead:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        phone: { type: [string, "null"] }
        company: { type: [string, "null"] }
        message: { type: string }
        source: { type: string }
        stage: { type: string }
        owner: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    Document:
      type: object
      properties:
        ref: { type: string }
        code: { type: string }
        title: { type: string }
        tenant_id: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [valid, revoked] }
        sha256: { type: [string, "null"] }
        issued_by: { type: string }
        issued_at: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        trace_id: { type: string }
