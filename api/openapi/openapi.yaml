openapi: 3.1.0
info:
  title: HEKATE Platform API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-HEKATE
  description: Single API for the web ERP, portals and mobile app. Contract-first; SDKs are generated from this file.
servers:
  - url: https://api.hekatesystems.com
security:
  - oauth2: [tickets.read]
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/tickets:
    get:
      operationId: listTickets
      summary: List tickets
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page of tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Ticket" } }
                  next_cursor: { type: [string, "null"] }
        "4XX": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTicket
      summary: Open a ticket or incident
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewTicket" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "4XX": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.hekatesystems.com/realms/hekate/protocol/openid-connect/auth
          tokenUrl: https://auth.hekatesystems.com/realms/hekate/protocol/openid-connect/token
          scopes:
            tickets.read: Read tickets
            tickets.write: Create and update tickets
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Severity: { type: string, enum: [P1, P2, P3, P4] }
    Channel: { type: string, enum: [app, portal, email, phone] }
    NewTicket:
      type: object
      required: [subject, severity, channel]
      properties:
        subject: { type: string }
        description: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        channel: { $ref: "#/components/schemas/Channel" }
    Ticket:
      allOf:
        - $ref: "#/components/schemas/NewTicket"
        - type: object
          required: [id, status, created_at]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [open, in_progress, resolved, closed] }
            sla_due_at: { type: [string, "null"], format: date-time }
            created_at: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        trace_id: { type: string }
