    get:
      operationId: verifyDocument
      summary: Public check of a HEKATE document by reference
      security: []
      responses:
        "200":
          description: Verification result (valid=false for unknown, forged or revoked)
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: { type: boolean }
                  reason: { type: string }
                  ref: { type: string }
                  code: { type: string }
                  title: { type: string }
                  status: { type: string }
                  issued_at: { type: string, format: date-time }
                  sha256: { type: string, description: "SHA-256 of the issued PDF once generated; compare with sha256sum of a file you hold" }
                  superseded_by: { type: string, description: "Reference of the revision that replaced this document. The document itself stays authentic; this says a newer one exists." }
                  result: { type: string, enum: [authentic, replaced, revoked, not_found, malformed, signature_invalid] }
                  type: { type: string, description: "Official name of the document type" }
                  version: { type: string }
                  classification: { type: string }
                  issued_by: { type: string }
                  verified_count: { type: integer }
                  last_verified: { type: [string, "null"], format: date-time }
        "4XX": { $ref: "#/components/responses/Problem" }
