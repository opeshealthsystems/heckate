components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Read-only company API key (hk_...), created under Developer in the web app
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.hekatesystems.com/realms/hekate/protocol/openid-connect/auth
          tokenUrl: https://auth.hekatesystems.com/realms/hekate/protocol/openid-connect/token
          scopes: {}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        tenant_id: { type: [string, "null"], format: uuid }
        actor: { type: string }
        action: { type: string }
        entity: { type: string }
        entity_id: { type: [string, "null"] }
        trace_id: { type: [string, "null"] }
        chain_seq: { type: [integer, "null"] }
        hash: { type: [string, "null"] }
    NarrativeInput:
      type: object
      required: [title, sections]
      properties:
        kind: { type: string, enum: [proposal, order_confirmation, sow, letter, certificate, guarantee, contract, pentest_report, form], description: "Required on create, ignored on edit" }
        form: { type: string, description: "For kind form: the HS-FRM code such as FRM-23 (06-15, 23, 24, 26, 31-33, 37, 39, 41)" }
        tenant_id: { type: string, format: uuid, description: "Required on create, ignored on edit" }
        title: { type: string, maxLength: 200 }
        signed_by: { type: string }
        sections:
          type: array
          minItems: 1
          maxItems: 60
          items:
            type: object
            required: [body]
            properties:
              heading: { type: string }
              body: { type: string }
    Narrative:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        form_code: { type: [string, "null"] }
        tenant_id: { type: string, format: uuid }
        title: { type: string }
        sections: { type: array, items: { type: object, properties: { heading: { type: string }, body: { type: string } } } }
        ref: { type: [string, "null"] }
        signed_by: { type: [string, "null"] }
        created_by: { type: string }
        issued_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        revision: { type: integer, description: "1 for the first document; a revision of an issued document counts up" }
        supersedes: { type: [string, "null"], description: "Id of the issued document this one replaces" }
        superseded_by: { type: [string, "null"], description: "Reference of the issued revision that replaced this document" }
    Verification:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        result: { type: string, enum: [authentic, replaced, revoked, not_found, malformed, signature_invalid] }
        reason: { type: string }
        ref: { type: string }
        code: { type: string }
        type: { type: string }
        title: { type: string }
        status: { type: string }
        issued_at: { type: string, format: date-time }
        version: { type: string }
        classification: { type: string }
        issued_by: { type: string }
        sha256: { type: string }
        superseded_by: { type: string }
        verified_count: { type: integer }
        last_verified: { type: [string, "null"], format: date-time }
        signature:
          type: object
          properties: { checked: { type: boolean }, valid: { type: boolean }, scheme: { type: string }, reason: { type: string } }
    NarrativeVersion:
      type: object
      properties:
        version: { type: integer }
        event: { type: string, enum: [created, edited, issued] }
        title: { type: string }
        sections: { type: array, items: { type: object, properties: { heading: { type: string }, body: { type: string } } } }
        signed_by: { type: [string, "null"] }
        change_note: { type: string }
        changed_by: { type: string }
        changed_at: { type: string, format: date-time }
        content_sha256: { type: string }
    OnlinePayment:
      type: object
      properties:
        id: { type: string, format: uuid }
        invoice_id: { type: string, format: uuid }
        amount: { type: integer }
        provider: { type: string }
        msisdn: { type: string }
        status: { type: string, enum: [pending, succeeded, failed, expired, review] }
        provider_ref: { type: [string, "null"] }
        reason: { type: string }
        created_at: { type: string, format: date-time }
    BankStatement:
      type: object
      properties:
        id: { type: string, format: uuid }
        account: { type: string }
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        opening: { type: integer }
        closing: { type: integer }
        imported_by: { type: string }
        lines: { type: integer }
        matched: { type: integer }
    Reconciliation:
      type: object
      properties:
        statement: { $ref: "#/components/schemas/BankStatement" }
        lines: { type: array, items: { $ref: "#/components/schemas/Object" } }
        unmatched_ledger: { type: array, items: { $ref: "#/components/schemas/Object" } }
        summary: { $ref: "#/components/schemas/Object" }
        auto_matched: { type: integer }
    PayrollRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        period: { type: string }
        status: { type: string, enum: [draft, approved, paid] }
        prepared_by: { type: string }
        approved_by: { type: [string, "null"] }
        paid_by: { type: [string, "null"] }
        total_gross: { type: integer }
        total_net: { type: integer }
        total_cost: { type: integer }
        created_at: { type: string, format: date-time }
        approved_at: { type: [string, "null"], format: date-time }
        paid_at: { type: [string, "null"], format: date-time }
        payslips: { type: array, items: { $ref: "#/components/schemas/Payslip" } }
        skipped: { type: array, items: { type: string }, description: Active employees with no salary on file }
    Payslip:
      type: object
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        period: { type: string }
        actor: { type: string }
        full_name: { type: string }
        gross: { type: integer }
        deductions: { type: array, items: { $ref: "#/components/schemas/PayLine" } }
        irpp: { type: integer }
        cac: { type: integer }
        net: { type: integer }
        employer_lines: { type: array, items: { $ref: "#/components/schemas/PayLine" } }
        employer_cost: { type: integer }
    PayLine:
      type: object
      properties:
        code: { type: string }
        label: { type: string }
        base: { type: integer }
        rate_bp: { type: integer }
        amount: { type: integer }
    ApiPlan:
      type: object
      required: [code, name, rate_per_min, monthly_quota]
      properties:
        code: { type: string }
        name: { type: string }
        rate_per_min: { type: integer }
        monthly_quota: { type: integer }
        price_xaf: { type: integer }
        active: { type: boolean }
    ApiKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        scopes: { type: array, items: { type: string } }
        plan: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
    Object: { type: object, additionalProperties: true }
    Lines:
      type: array
      items:
        type: object
        required: [description, quantity, unit_price]
        properties:
          description: { type: string }
          quantity: { type: number, description: "At most two decimals" }
          unit_price: { type: integer, description: "XAF" }
    Severity: { type: string, enum: [P1, P2, P3, P4] }
    Status: { type: string, enum: [open, in_progress, resolved, closed] }
    Channel: { type: string, enum: [app, portal, email, phone] }
    NewTicket:
      type: object
      required: [subject, severity, channel]
