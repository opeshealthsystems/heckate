              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/expenses/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: approveExpenseClaim
      summary: "Approve a claim (not your own)"
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/expenses/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: rejectExpenseClaim
      summary: "Reject a claim (not your own)"
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/expenses/{id}/pay:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: payExpenseClaim
      summary: "Pay an approved claim (a different person from the approver)"
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/attachments:
    get:
      operationId: listAttachments
      summary: List attachments of a ticket, intervention or expense claim
      parameters:
        - { name: entity_type, in: query, required: true, schema: { type: string, enum: [ticket, intervention, expense] } }
        - { name: entity_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Attachment metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
    post:
      operationId: uploadAttachment
      summary: "Attach a JPEG, PNG, WebP or PDF (max 10 MB). The type is detected from the bytes."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [entity_type, entity_id, file]
              properties:
                entity_type: { type: string, enum: [ticket, intervention, expense] }
                entity_id: { type: string, format: uuid }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/attachments/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: downloadAttachment
      summary: Download an attachment (sent as a download with nosniff and a sandbox CSP)
      responses:
        "200":
          description: The file
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/stream:
    get:
      operationId: openEventStream
      summary: "WebSocket of live ticket and site-visit events. Authenticate with the subprotocols hekate.v1 and bearer.<token>."
      description: "Events are hints to refetch ({subject, data}); clients only hear about their own tenant. The connection ends when the token expires. At most 5 connections per user."
      security: []
      responses:
        "101": { description: Switching protocols }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/invoices/{id}/pdf:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: downloadInvoicePdf
      summary: "PDF of an issued invoice with a verification QR code"
      responses:
        "200":
          description: "The canonical PDF. The first rendering is stored, so every download is the same file; its SHA-256 is in the X-Document-SHA256 header and the public register."
          headers:
            X-Document-SHA256: { schema: { type: string } }
          content:
            application/pdf: { schema: { type: string, format: binary } }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/quotes/{id}/pdf:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: downloadQuotePdf
      summary: "PDF of a sent quotation"
      responses:
        "200":
          description: "The canonical PDF. The first rendering is stored, so every download is the same file; its SHA-256 is in the X-Document-SHA256 header and the public register."
          headers:
            X-Document-SHA256: { schema: { type: string } }
          content:
            application/pdf: { schema: { type: string, format: binary } }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/interventions/{id}/pdf:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: downloadInterventionPdf
      summary: "PDF of a completed site visit: report, GPS times and the client's signature"
      responses:
        "200":
          description: "The canonical PDF. The first rendering is stored, so every download is the same file; its SHA-256 is in the X-Document-SHA256 header and the public register."
          headers:
            X-Document-SHA256: { schema: { type: string } }
          content:
            application/pdf: { schema: { type: string, format: binary } }
        "4XX": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.hekatesystems.com/realms/hekate/protocol/openid-connect/auth
          tokenUrl: https://auth.hekatesystems.com/realms/hekate/protocol/openid-connect/token
          scopes: {}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Object: { type: object, additionalProperties: true }
    Lines:
      type: array
      items:
        type: object
        required: [description, quantity, unit_price]
        properties:
          description: { type: string }
          quantity: { type: number, description: "At most two decimals" }
          unit_price: { type: integer, description: "XAF" }
    Severity: { type: string, enum: [P1, P2, P3, P4] }
    Status: { type: string, enum: [open, in_progress, resolved, closed] }
    Channel: { type: string, enum: [app, portal, email, phone] }
    NewTicket:
      type: object
      required: [subject, severity, channel]
      properties:
        tenant_id: { type: string, format: uuid, description: "Required for staff; clients use their own tenant" }
        subject: { type: string }
        description: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        channel: { $ref: "#/components/schemas/Channel" }
    Ticket:
      type: object
      required: [id, tenant_id, subject, severity, channel, status, version, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        subject: { type: string }
        description: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        channel: { $ref: "#/components/schemas/Channel" }
        status: { $ref: "#/components/schemas/Status" }
        reporter: { type: string }
        assignee: { type: [string, "null"] }
        respond_due_at: { type: [string, "null"], format: date-time }
        sla_due_at: { type: [string, "null"], format: date-time }
        first_response_at: { type: [string, "null"], format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
        sla_breached: { type: boolean }
        rating: { type: [integer, "null"] }
        rating_comment: { type: [string, "null"] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticket_id: { type: string, format: uuid }
        author: { type: string }
        body: { type: string }
        internal: { type: boolean }
        created_at: { type: string, format: date-time }
    Client:
      type: object
      properties:
        tenant_id: { type: string, format: uuid }
        legal_name: { type: string }
        rccm: { type: [string, "null"] }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        kyc_status: { type: string, enum: [pending, verified, rejected] }
        created_at: { type: string, format: date-time }
    Lead:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        phone: { type: [string, "null"] }
        company: { type: [string, "null"] }
        message: { type: string }
        source: { type: string }
        stage: { type: string }
        owner: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    Document:
      type: object
      properties:
        ref: { type: string }
        code: { type: string }
        title: { type: string }
        tenant_id: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [valid, revoked] }
        sha256: { type: [string, "null"] }
        issued_by: { type: string }
        issued_at: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        trace_id: { type: string }
