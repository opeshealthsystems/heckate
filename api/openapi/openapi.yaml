openapi: 3.1.0
info:
  title: HEKATE Platform API
  version: 1.0.0
  description: Single API for the web ERP, portals and mobile app. Contract-first; SDKs are generated from this file.
  license:
    name: Proprietary
    identifier: LicenseRef-HEKATE
servers:
  - url: https://api.hekatesystems.com
security:
  - oauth2: []
  - apiKey: []
paths:
  /livez:
    get:
      operationId: getLiveness
      summary: Liveness - the process is running (never touches the database)
      security: []
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "4XX": { $ref: "#/components/responses/Problem" }
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness - safe to send traffic (the database answers)
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "4XX": { $ref: "#/components/responses/Problem" }
  /healthz:
    get:
      operationId: getHealth
      summary: Alias of /readyz
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/me:
    get:
      operationId: getMe
      summary: The authenticated caller
      responses:
        "200":
          description: Caller identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub: { type: string }
                  email: { type: string }
                  tenant_id: { type: string }
                  roles: { type: array, items: { type: string } }
                  scope: { type: string, enum: [staff, client, other] }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/devices:
    put:
      operationId: registerDevice
      summary: Register this device for push notifications (re-registering moves it to the caller)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string }
                platform: { type: string, enum: [ios, android, expo] }
      responses:
        "204": { description: Registered }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/devices/{token}:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: unregisterDevice
      summary: Stop push notifications to a device
      responses:
        "204": { description: Removed }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/api-plans:
    get:
      operationId: listApiPlans
      summary: API plans (rate limit and monthly quota)
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ApiPlan" } }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/api-plans/{code}:
    parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
    put:
      operationId: putApiPlan
      summary: Create or change an API plan (CEO, manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiPlan" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiPlan" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/api-keys:
    get:
      operationId: listApiKeys
      summary: API keys (own company; staff see all). Secrets are never returned.
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ApiKey" } }
        "4XX": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createApiKey
      summary: Create a read-only API key for the company (client admin). The secret is shown once.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes: { type: array, items: { type: string }, description: "read:tickets, read:invoices or read:*" }
                plan: { type: string, default: free }
                expires_in_days: { type: integer }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { $ref: "#/components/schemas/ApiKey" }
                  secret: { type: string }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/api-keys/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key
      responses:
        "204": { description: Revoked }
        "4XX": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: setApiKeyPlan
      summary: Move a key to another plan (CEO, manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/api-keys/{id}/usage:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getApiKeyUsage
      summary: Calls per month for a key
      responses:
        "200":
          description: Usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        month: { type: string }
                        calls: { type: integer }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/payroll/compensation:
    get:
      operationId: listCompensation
      summary: Current salary per employee (HR, finance, CEO)
      responses:
        "200":
          description: Compensation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Object" } }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/payroll/compensation/{employee_id}:
    parameters: [{ name: employee_id, in: path, required: true, schema: { type: string, format: uuid } }]
    put:
      operationId: setCompensation
      summary: Set an employee's salary from a date (HR, CEO). Earlier dates are never rewritten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effective_from, base_salary]
              properties:
                effective_from: { type: string, format: date }
                base_salary: { type: integer }
                allowances: { type: integer }
      responses:
        "201": { description: Set }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/payroll/config:
    get:
      operationId: getPayrollConfig
      summary: The payroll rules (contribution rates, ceilings, tax brackets) and who validated them
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
    put:
      operationId: putPayrollConfig
      summary: Replace the payroll rules (finance, CEO). Clears the validation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Object" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/payroll/config/validate:
    post:
      operationId: validatePayrollConfig
      summary: Validate the current rules (finance, CEO; not the person who edited them)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Validated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/payroll/runs:
    get:
      operationId: listPayrollRuns
      summary: Payroll runs (HR, finance, management, auditor)
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PayrollRun" } }
        "4XX": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPayrollRun
      summary: Prepare a month's payroll as a draft. Needs validated rules.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              properties:
                period: { type: string, example: "2026-10" }
      responses:
        "201":
          description: Draft run with payslips
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollRun" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/payroll/runs/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getPayrollRun
      summary: A run with its payslips
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollRun" }
        "4XX": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: discardPayrollRun
      summary: Discard a draft run
      responses:
        "204": { description: Discarded }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/payroll/runs/{id}/approve:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: approvePayrollRun
      summary: Approve a run and post it to the ledger (finance, management; not the preparer)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollRun" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/payroll/runs/{id}/pay:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: payPayrollRun
      summary: Record that net salaries were paid (finance, management; not the preparer or approver)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Paid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayrollRun" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/payslips/me:
    get:
      operationId: listMyPayslips
      summary: The caller's own payslips, once their run is approved
      responses:
        "200":
          description: Payslips
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Payslip" } }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/bank/statements:
    get:
      operationId: listBankStatements
      summary: Imported bank statements with how many lines are matched (finance, management, auditor)
      responses:
        "200":
          description: Statements
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/BankStatement" } }
        "4XX": { $ref: "#/components/responses/Problem" }
    post:
      operationId: importBankStatement
      summary: Import a statement from CSV (date, description, amount, reference). Opening plus lines must equal closing.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, opening, closing, csv]
              properties:
                account: { type: string, description: "A treasury account (class 5) from the chart, for example 521" }
                opening: { type: integer }
                closing: { type: integer }
                csv: { type: string }
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reconciliation" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/bank/statements/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getBankStatement
      summary: A statement with suggested matches, unmatched ledger lines and the reconciliation summary
      responses:
        "200":
          description: Statement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reconciliation" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/bank/statements/{id}/auto-match:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: autoMatchBankStatement
      summary: Match every bank line that has exactly one possible ledger line
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: Updated statement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reconciliation" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/bank/lines/{id}/match:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: matchBankLine
      summary: Match a bank line to a ledger line of the same account and amount
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entry_line_id]
              properties:
                entry_line_id: { type: integer }
      responses:
        "204": { description: Matched }
        "4XX": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: unmatchBankLine
      summary: Undo a match
      responses:
        "204": { description: Unmatched }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/payment-providers:
    get:
      operationId: listPaymentProviders
      summary: Which online payment providers are switched on
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: string, enum: [momo, orange_money] } }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/invoices/{id}/online-payments:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: listOnlinePayments
      summary: Online payment attempts for an invoice
      responses:
        "200":
          description: Attempts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/OnlinePayment" } }
        "4XX": { $ref: "#/components/responses/Problem" }
    post:
      operationId: startOnlinePayment
      summary: Ask the client's phone to approve a mobile money payment (client users). Settles only when the provider confirms.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, msisdn]
              properties:
                provider: { type: string, enum: [momo, orange_money] }
                msisdn: { type: string, example: "237670000000" }
                amount: { type: integer, description: Defaults to the outstanding balance }
      responses:
        "202":
          description: Request sent; waiting for approval on the phone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnlinePayment" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/online-payments/{id}/refresh:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: refreshOnlinePayment
      summary: Ask the provider what became of a request and settle it if the answer is final
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnlinePayment" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/webhooks/payments/{provider}:
    parameters: [{ name: provider, in: path, required: true, schema: { type: string, enum: [momo, orange_money] } }]
    post:
      operationId: paymentCallback
      summary: Provider callback. Authenticated by an HMAC-SHA256 signature of the body in X-Hekate-Signature (sha256=hex).
      security: []
      parameters: [{ name: X-Hekate-Signature, in: header, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, reference, status]
              properties:
                event_id: { type: string }
                reference: { type: string, format: uuid }
                status: { type: string, enum: [succeeded, failed] }
                amount: { type: integer }
                reason: { type: string }
      responses:
        "200": { description: Accepted (repeated deliveries are harmless) }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/audit:
    get:
      operationId: listAuditTrail
      summary: The audit trail, newest first (CEO, manager, auditor)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: before, in: query, schema: { type: integer }, description: Only entries older than this id }
        - { name: actor, in: query, schema: { type: string } }
        - { name: entity, in: query, schema: { type: string } }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
                  next_before: { type: [integer, "null"] }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/audit/verify:
    get:
      operationId: verifyAuditTrail
      summary: Recompute the audit hash chain and report the first row that does not match
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  checked: { type: integer }
                  intact: { type: boolean }
                  first_broken_seq: { type: [integer, "null"] }
                  waiting_to_be_sealed: { type: integer }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/clients:
    get:
      operationId: listClients
      summary: List client accounts (staff)
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Client" } }
        "4XX": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createClient
      summary: Create a client account (staff)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legal_name]
              properties:
                legal_name: { type: string }
                rccm: { type: string }
                email: { type: string }
                phone: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/clients/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getClient
      summary: Get a client account (staff, or the client's own)
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "4XX": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateClient
      summary: "Update contact details or KYC status (KYC: managers only)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kyc_status: { type: string, enum: [pending, verified, rejected] }
                email: { type: string }
                phone: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/public/enquiries:
    post:
      operationId: submitEnquiry
      summary: Website contact or quote form; creates a CRM lead
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                company: { type: string }
                message: { type: string }
                website: { type: string, description: "Honeypot; must be empty" }
      responses:
        "202": { description: Received }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/leads:
    get:
      operationId: listLeads
      summary: List CRM leads (sales)
      responses:
        "200":
          description: Leads
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Lead" } }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/leads/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      operationId: updateLead
      summary: Move a lead through the pipeline or assign an owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stage: { type: string, enum: [new, contacted, qualified, proposal, won, lost] }
                owner: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/tickets:
    get:
      operationId: listTickets
      summary: List tickets (clients see only their own)
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { name: severity, in: query, schema: { $ref: "#/components/schemas/Severity" } }
      responses:
        "200":
          description: A page of tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Ticket" } }
                  next_cursor: { type: [string, "null"] }
        "4XX": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTicket
      summary: Open a ticket or incident
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewTicket" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/tickets/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getTicket
      summary: Get a ticket
      responses:
        "200":
