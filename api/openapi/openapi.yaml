openapi: 3.1.0
info:
  title: HEKATE Platform API
  version: 1.0.0
  description: Single API for the web ERP, portals and mobile app. Contract-first; SDKs are generated from this file.
  license:
    name: Proprietary
    identifier: LicenseRef-HEKATE
servers:
  - url: https://api.hekatesystems.com
security:
  - oauth2: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and database check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/me:
    get:
      operationId: getMe
      summary: The authenticated caller
      responses:
        "200":
          description: Caller identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub: { type: string }
                  email: { type: string }
                  tenant_id: { type: string }
                  roles: { type: array, items: { type: string } }
                  scope: { type: string, enum: [staff, client, other] }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/devices:
    put:
      operationId: registerDevice
      summary: Register this device for push notifications (re-registering moves it to the caller)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string }
                platform: { type: string, enum: [ios, android, expo] }
      responses:
        "204": { description: Registered }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/devices/{token}:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    delete:
      operationId: unregisterDevice
      summary: Stop push notifications to a device
      responses:
        "204": { description: Removed }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/clients:
    get:
      operationId: listClients
      summary: List client accounts (staff)
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Client" } }
        "4XX": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createClient
      summary: Create a client account (staff)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legal_name]
              properties:
                legal_name: { type: string }
                rccm: { type: string }
                email: { type: string }
                phone: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/clients/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getClient
      summary: Get a client account (staff, or the client's own)
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "4XX": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateClient
      summary: "Update contact details or KYC status (KYC: managers only)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kyc_status: { type: string, enum: [pending, verified, rejected] }
                email: { type: string }
                phone: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/public/enquiries:
    post:
      operationId: submitEnquiry
      summary: Website contact or quote form; creates a CRM lead
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                company: { type: string }
                message: { type: string }
                website: { type: string, description: "Honeypot; must be empty" }
      responses:
        "202": { description: Received }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/leads:
    get:
      operationId: listLeads
      summary: List CRM leads (sales)
      responses:
        "200":
          description: Leads
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Lead" } }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/leads/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      operationId: updateLead
      summary: Move a lead through the pipeline or assign an owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stage: { type: string, enum: [new, contacted, qualified, proposal, won, lost] }
                owner: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/tickets:
    get:
      operationId: listTickets
      summary: List tickets (clients see only their own)
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { name: severity, in: query, schema: { $ref: "#/components/schemas/Severity" } }
      responses:
        "200":
          description: A page of tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Ticket" } }
                  next_cursor: { type: [string, "null"] }
        "4XX": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTicket
      summary: Open a ticket or incident
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewTicket" }
      responses:
        "201":
          description: Created
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/tickets/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getTicket
      summary: Get a ticket
      responses:
        "200":
          description: Ticket
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "4XX": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateTicket
      summary: Change status or assignee (clients may only confirm or reopen a resolved ticket)
      parameters:
        - { name: If-Match, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: "#/components/schemas/Status" }
                assignee: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/tickets/{id}/comments:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: listTicketComments
      summary: Conversation on a ticket (internal notes are staff-only)
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Comment" } }
        "4XX": { $ref: "#/components/responses/Problem" }
    post:
      operationId: addTicketComment
      summary: Reply on a ticket
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                internal: { type: boolean, default: false }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/tickets/{id}/rating:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      operationId: rateTicket
      summary: Rate a resolved or closed ticket (client)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        "200":
          description: Rated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/reports/support:
    get:
      operationId: getSupportReport
      summary: SLA and satisfaction summary (management)
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  open: { type: integer }
                  sla_breached: { type: integer }
                  p1_open: { type: integer }
                  rated: { type: integer }
                  avg_rating: { type: [number, "null"] }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/documents:
    post:
      operationId: issueDocument
      summary: Issue a document reference and register it
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, title]
              properties:
                code: { type: string, examples: [INV, FRM-23, CRT-A] }
                title: { type: string }
                tenant_id: { type: string, format: uuid }
                sha256: { type: string }
      responses:
        "201":
          description: Issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/documents/{ref}:
    parameters: [{ name: ref, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getDocument
      summary: Register entry for a document
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/documents/{ref}/revoke:
    parameters: [{ name: ref, in: path, required: true, schema: { type: string } }]
    post:
      operationId: revokeDocument
      summary: Revoke a document (managers)
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/public/verify/{ref}:
    parameters: [{ name: ref, in: path, required: true, schema: { type: string } }]
    get:
      operationId: verifyDocument
      summary: Public check of a HEKATE document by reference
      security: []
      responses:
        "200":
          description: Verification result (valid=false for unknown, forged or revoked)
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: { type: boolean }
                  reason: { type: string }
                  ref: { type: string }
                  code: { type: string }
                  title: { type: string }
                  status: { type: string }
                  issued_at: { type: string, format: date-time }
                  sha256: { type: string, description: "SHA-256 of the issued PDF once generated; compare with sha256sum of a file you hold" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/quotes:
    post:
      operationId: createQuote
      summary: "Create a draft quotation (sales)"
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, title, lines]
              properties:
                tenant_id: { type: string, format: uuid }
                title: { type: string }
                valid_until: { type: string, format: date }
                notes: { type: string }
                lines: { $ref: "#/components/schemas/Lines" }
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listQuotes
      summary: "List quotations (clients see only those sent to them)"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/quotes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getQuote
      summary: "Get a quotation with lines and totals"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/quotes/{id}/lines:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: replaceQuoteLines
      summary: "Replace the lines of a draft quotation"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines: { $ref: "#/components/schemas/Lines" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/quotes/{id}/send:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: sendQuote
      summary: "Send a draft quotation; assigns its HS-QT reference"
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/quotes/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: approveQuote
      summary: "Client admin approves a sent quotation"
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/quotes/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: rejectQuote
      summary: "Client admin rejects a sent quotation"
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/quotes/{id}/invoice:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: invoiceQuote
      summary: "Create a draft invoice from an approved quotation"
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/invoices:
    post:
      operationId: createInvoice
      summary: "Create a draft invoice"
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, title, lines]
              properties:
                tenant_id: { type: string, format: uuid }
                title: { type: string }
                due_date: { type: string, format: date }
                lines: { $ref: "#/components/schemas/Lines" }
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
    get:
      operationId: listInvoices
      summary: "List invoices (clients see only issued ones of their own)"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/invoices/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getInvoice
      summary: "Get an invoice with lines, payments and balance"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/invoices/{id}/issue:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: issueInvoice
      summary: "Issue an invoice; 202 means a second approver is needed above the threshold"
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/invoices/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: approveInvoice
      summary: "Second approver issues a pending invoice (not the preparer)"
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/invoices/{id}/payments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: recordPayment
      summary: "Record a payment against an issued invoice"
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, method]
              properties:
                amount: { type: integer }
                method: { type: string }
                reference: { type: string }
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/invoices/{id}/credit-notes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: createCreditNote
      summary: "Issue a credit note (HS-CN) against an issued invoice"
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [net, reason]
              properties:
                net: { type: integer }
                reason: { type: string }
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/reports/sales:
    get:
      operationId: getSalesReport
      summary: "Invoiced, collected, outstanding and pipeline (finance, management)"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/accounting/accounts:
    get:
      operationId: listAccounts
      summary: "Chart of accounts"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAccount
      summary: "Add an account"
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/accounting/entries:
    get:
      operationId: listEntries
      summary: "Latest ledger entries with their hash"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
    post:
      operationId: postEntry
      summary: "Post a balanced manual journal entry"
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [journal, entry_date, narration, lines]
              properties:
                journal: { type: string }
                entry_date: { type: string, format: date }
                narration: { type: string }
                lines: { type: array, items: { type: object, additionalProperties: true } }
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/accounting/trial-balance:
    get:
      operationId: getTrialBalance
      summary: "Trial balance for a period"
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/accounting/ledger/{account}:
    parameters:
      - { name: account, in: path, required: true, schema: { type: string } }
    get:
      operationId: getAccountLedger
      summary: "Running ledger for one account"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/accounting/verify:
    get:
      operationId: verifyLedger
      summary: "Recompute the hash chain and report the first broken entry, if any"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Object" }
        "4XX": { $ref: "#/components/responses/Problem" }
  /v1/projects:
    post:
      operationId: createProject
      summary: "Create a project (management)"
      parameters:
